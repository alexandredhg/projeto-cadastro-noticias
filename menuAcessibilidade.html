<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Acessibilidade </title>
    <link rel="stylesheet" href="css/menuAcessibilidade.css">

</head>

    <body>

        <!--Acessibilidade Skip Link-->                
        <div>
            <!--control+home Ouvir inicio da Página.-->
            <span aria-label="Inicio da Página">&nbsp;</span>

            <a href="#conteudoPrincipal" class="skipLink">
                Ir para conteúdo principal
            </a>
        </div>

        <!--Memu Acessibilidade-->
        <div>
            <button id="btnAcessibilidade" class="btnAcessibilidade" aria-expanded="false">
                <!--&#9855; Acessibilidade-->
                <img src="img/images.png" width="20">
                Acessibilidade
            </button>

            <!--div id="menuAcessibilidade" hidden>-->
            <div id="menuAcessibilidade" class="menuAcessibilidade" hidden>
                <button id="btnAumentarFonte" class="menuAcessibilidadeButton" 
                aria-label="Aumentar Fonte">
                    Aumentar Fonte
                </button>

                <button id="btnDiminuirFonte" class="menuAcessibilidadeButton" 
                aria-label="diminuir fonte">
                    Diminuir Fonte
                </button>

                <!--<button id="btnRestaurarFonte" 
                aria-label="restaurar fonte">
                    Restaurar Fonte
                </button>-->

                <button id="btnAlterarContraste" class="menuAcessibilidadeButton" 
                aria-label="alterar contraste">
                    Alterar Contraste
                </button>
            </div>
        </div>

    </body>

</html>
